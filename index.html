<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevda Zamanı - Zikirmatik & İslami Rehber</title>
    
    <!-- PWA Manifest & Service Worker Registration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sevda Zamanı">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2833/2833315.png">
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker Kaydedildi:', reg))
            .catch(err => console.log('Service Worker Hatası:', err));
        });
      }
    </script>

    <!-- FontAwesome & Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #10b981;
            --primary-gold: #fbbf24;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-gold);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Zikirmatik Styling */
        .zikir-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .counter-display {
            font-size: 4rem;
            font-weight: 700;
            color: var(--primary);
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .zikir-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(16,185,129,0.05) 100%);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
            transition: transform 0.1s;
        }

        .zikir-btn:active {
            transform: scale(0.92);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-sm {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(9, 10, 15, 0.95);
            border-top: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        .nav-item.active {
            color: var(--primary-gold);
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        /* Map Container */
        #map {
            height: 300px;
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid =>-kaaba"></i> Sevda Zamanı</h1>
            <p>Zikirmatik & İslami Rehber</p>
        </header>

        <!-- Zikirmatik Tab -->
        <div id="tab-zikir" class="tab-content active">
            <div class="card zikir-card">
                <p style="color: var(--primary-gold);">Sübhanallah</p>
                <div class="counter-display" id="counter">0</div>
                <button class="zikir-btn" onclick="incrementCounter()">
                    <i class="fa-solid fa-fingerprint"></i>
                </button>
                <div class="controls">
                    <button class="btn-sm" onclick="resetCounter()"><i class="fa-solid fa-rotate-right"></i> Sıfırla</button>
                </div>
            </div>
        </div>

        <!-- Kıble Bulucu Tab -->
        <div id="tab-kible" class="tab-content">
            <div class="card">
                <h3><i class="fa-solid fa-compass"></i> Kıble Yönü</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">Konumunuza göre Kabe yönünü görebilirsiniz.</p>
                <div id="map"></div>
            </div>
        </div>

        <!-- Dualar Tab -->
        <div id="tab-dualar" class="tab-content">
            <div class="card">
                <h3 style="color: var(--primary-gold);">Günün Duası</h3>
                <p style="margin-top: 10px; line-height: 1.5; font-size: 0.95rem;">"Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver ve bizi ateş azabından koru." (Bakara, 201)</p>
            </div>
        </div>
    </div>

    <!-- Alt Menü -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('tab-zikir', this)">
            <i class="fa-solid fa-hand-pointer"></i>
            Zikirmatik
        </button>
        <button class="nav-item" onclick="switchTab('tab-kible', this)">
            <i class="fa-solid fa-compass"></i>
            Kıble
        </button>
        <button class="nav-item" onclick="switchTab('tab-dualar', this)">
            <i class="fa-solid fa-book-quran"></i>
            Dualar
        </button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let count = 0;
        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = count;
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        function resetCounter() {
            count = 0;
            document.getElementById('counter').innerText = count;
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');

            if (tabId === 'tab-kible' && !window.mapInitialized) {
                initMap();
            }
        }

        function initMap() {
            window.mapInitialized = true;
            setTimeout(() => {
                const map = L.map('map').setView([21.4225, 39.8262], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: 'OpenStreetMap'
                }).addTo(map);

                L.marker([21.4225, 39.8262]).addTo(map)
                    .bindPopup('Mekke-i Mükerreme (Kabe-i Muazzama)')
                    .openPopup();
            }, 200);
        }
    </script>
</body>
</html>
